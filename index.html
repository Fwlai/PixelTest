<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixeltest</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #rotateMessage {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 8px;
            z-index: 10;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: transparent;
            border: 3px solid #fff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: #fff;
            cursor: pointer;
        }

        .btn:active,
        .btn.active {
            background: #fff;
            color: #000;
        }

        .btn-up {
            grid-column: 2;
            grid-row: 1;
        }

        .btn-left {
            grid-column: 1;
            grid-row: 2;
        }

        .btn-down {
            grid-column: 2;
            grid-row: 2;
        }

        .btn-right {
            grid-column: 3;
            grid-row: 2;
        }

        #welcomeOverlay {
            position: absolute;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
        }

        #loadingOverlay {
            position: absolute;
            inset: 0;
            z-index: 200;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 18px;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            text-align: center;
            padding: 0 20px;
        }

        #loadingOverlay[hidden] {
            display: none;
        }

        #loadingText {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        #loadingBar {
            width: min(60vw, 320px);
            height: 20px;
            border: 3px solid #fff;
            padding: 2px;
        }

        #loadingFill {
            width: 0%;
            height: 100%;
            background: #fff;
        }

        #loadingHint {
            font-size: 14px;
            opacity: 0.75;
            min-height: 18px;
        }

        #loadingReload {
            min-width: 160px;
            min-height: 48px;
            background: #000;
            border: 4px solid #fff;
            color: #fff;
            font-size: 22px;
            font-family: "Courier New", Courier, monospace;
        }

        #loadingReload:active {
            background: #fff;
            color: #000;
        }

        #welcomeOverlay[hidden] {
            display: none;
        }

        #welcomeDialog {
            width: min(80vw, 380px);
            padding: 24px 20px;
            background: #000;
            border: 4px solid #fff;
            box-shadow: 0 0 0 4px #000, 0 0 0 8px #fff;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            text-align: center;
        }

        #welcomeText {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }

        #welcomeOk {
            min-width: 180px;
            min-height: 56px;
            padding: 8px 20px;
            background: #000;
            border: 4px solid #fff;
            color: #fff;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
        }

        #welcomeOk:active {
            background: #fff;
        }

        @media screen and (orientation: portrait) {
            #rotateMessage {
                display: flex !important;
            }

            #gameContainer {
                display: none !important;
            }
        }

        @media screen and (orientation: landscape) {
            #rotateMessage {
                display: none !important;
            }

            #gameContainer {
                display: block !important;
            }
        }
    #welcomeOverlay { background: rgba(20, 0, 40, 0.7); }

            box-shadow: 0 0 0 4px #7a2cff, 0 0 0 8px #ff4fa3, 0 10px 0 8px rgba(0,0,0,.45);
            animation: pop .5s ease-out; }

            animation: none; }

            box-shadow: 0 1px 0 #a8205f; }
        @keyframes pop { 0% { transform: scale(.5); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        #camBtn { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; z-index: 10;

            padding: 60px 30px 38px;
            box-shadow:
                0 -4px 0 #000, 0 4px 0 #000, -4px 0 0 #000, 4px 0 0 #000,
                inset 0 6px 0 #c9a0ff, inset 0 -6px 0 #7a35d6;
        }

        #welcomeDialog::before {
            content: '';
            position: absolute;
            left: 14px;

        }

        #welcomeDialog::after {
            content: '\00d7';
            position: absolute;
            top: 6px;
            right: 22px;
            font: bold 24px monospace;
            color: #000;
            z-index: 1;
        }

        #welcomeText {
            position: relative;
            z-index: 1;
            color: #3b1670;
            text-shadow: none;
            margin-bottom: 22px;
        }

        #welcomeOk {
            position: relative;
            z-index: 1;
            background: #e84bd8;
            border: 4px solid #000;
            border-radius: 30px;
            color: #fff;
            min-width: 200px;
            min-height: 60px;
            box-shadow: inset 0 5px 0 #ff9cf2, inset 0 -6px 0 #b11fa6;
        }

        #welcomeOk:active {
            background: #e84bd8;
            animation: none;
            transform: translateY(4px);
            box-shadow: inset 0 3px 0 #ff9cf2, inset 0 -3px 0 #b11fa6;
        }
    </style>
</head>
<body>
    <div id="rotateMessage">ROTATE DEVICE</div>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="welcomeOverlay" hidden>
            <div id="welcomeDialog" role="dialog" aria-modal="true" aria-labelledby="welcomeText">
                <p id="welcomeText">tavalodeee</p>
                <button id="welcomeOk" type="button" aria-label="OK">🥳🤩🥳🥳</button>
            </div>
        </div>

        <div id="loadingOverlay">
            <p id="loadingText">LOADING 0%</p>
            <div id="loadingBar"><div id="loadingFill"></div></div>
            <p id="loadingHint">FIRST LOAD CAN TAKE A WHILE</p>
            <button id="loadingReload" type="button" hidden>RELOAD</button>
        </div>

        <div id="camBtn">C</div>

        <div id="controls">
            <div class="btn btn-up" data-dir="up">↑</div>
            <div class="btn btn-left" data-dir="left">←</div>
            <div class="btn btn-down" data-dir="down">↓</div>
            <div class="btn btn-right" data-dir="right">→</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;

        function setupTelegram() {
            if (!tg) {
                return;
            }

            tg.ready();
            tg.expand();

            tg.disableVerticalSwipes?.();

            tg.setHeaderColor?.('#000000');
            tg.setBackgroundColor?.('#000000');
            tg.setBottomBarColor?.('#000000');

            tg.requestFullscreen?.();
        }

        try {
            setupTelegram();
        } catch (error) {
            // Telegram API errors must never stop the game.
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = false;

        const SERVER_URL = 'wss://pixeltest-server.onrender.com';
        const DEFAULT_SPRITE_FILE = 'SPRITE.png';

        // The room is a fixed-size world that is scaled to fit every screen,
        // so all players share the same coordinates.
        const WORLD_W = 640;
        const WORLD_H = 320;

        const ROOM_IMAGE_FILE = 'room.png';

        const FRAME_W = 21;
        const FRAME_H = 72;

        const SAFE_OFFSET_X = 1;
        const SAFE_OFFSET_Y = 1;
        const SAFE_W = FRAME_W - 2;
        const SAFE_H = FRAME_H - 2;

        const SCALE = 1;
        const SPRITE_W = SAFE_W * SCALE;
        const SPRITE_H = SAFE_H * SCALE;

        // Movement speed in world pixels per second.
        const SPEED = 90;

        // Walkable area for a character's feet, measured on the room art.
        const FEET_AREA = { minX: 60, maxX: 580, minY: 150, maxY: 315 };

        // Area where a sprite's top-left corner may move (derived from the feet area).
        const WALK_BOUNDS = {
            minX: FEET_AREA.minX - SPRITE_W / 2,
            maxX: FEET_AREA.maxX - SPRITE_W / 2,
            minY: FEET_AREA.minY - SPRITE_H,
            maxY: FEET_AREA.maxY - SPRITE_H
        };

        // Blocked rectangles for the feet position (the two gift piles, with a margin).
        const OBSTACLES = [
            { x: 511, y: 232, w: 91, h: 71 },
            { x: 21, y: 254, w: 79, h: 43 }
        ];

        function isFeetBlocked(x, y) {
            const feetX = x + SPRITE_W / 2;
            const feetY = y + SPRITE_H;

            return OBSTACLES.some(
                rect =>
                    feetX > rect.x &&
                    feetX < rect.x + rect.w &&
                    feetY > rect.y &&
                    feetY < rect.y + rect.h
            );
        }

        const STATE_SEND_INTERVAL_MS = 66;

        // Short sprites can walk further back: lowest allowed feet Y per sprite file.
        const FEET_MIN_Y_BY_SPRITE = { 'KOT.png': 120 };

        function minYFor(file) {
            return (FEET_MIN_Y_BY_SPRITE[file] ?? FEET_AREA.minY) - SPRITE_H;
        }

        // Camera: default shows the whole room; the C button toggles a zoomed follow camera.
        const CAM_ZOOM = 2.2;
        let followCam = false;

        function camAxis(view, world, desired) {
            return world <= view ? (view - world) / 2 : clamp(desired, view - world, 0);
        }

        document.getElementById('camBtn').addEventListener('pointerdown', event => {
            event.preventDefault();
            followCam = !followCam;
            event.currentTarget.classList.toggle('on', followCam);
        });

        const player = {
            x: 0,
            y: 0,
            dir: 'down',
            frame: 1,
            animStep: 0,
            isMoving: false,
            spriteFile: DEFAULT_SPRITE_FILE
        };

        const DIRECTIONS = {
            down: { row: 0, dx: 0, dy: 1 },
            left: { row: 1, dx: -1, dy: 0 },
            right: { row: 2, dx: 1, dy: 0 },
            up: { row: 3, dx: 0, dy: -1 }
        };

        function isDirection(value) {
            return typeof value === 'string' &&
                Object.prototype.hasOwnProperty.call(DIRECTIONS, value);
        }

        const spriteCache = new Map();

        function getSprite(file) {
            const safeFile = /^[A-Za-z0-9_.-]+\.png$/.test(file || '')
                ? file
                : DEFAULT_SPRITE_FILE;

            let entry = spriteCache.get(safeFile);

            if (!entry) {
                entry = { image: new Image(), ready: false, failed: false };

                entry.image.onload = () => {
                    entry.ready = true;
                };

                entry.image.onerror = () => {
                    entry.failed = true;
                };

                entry.image.src = safeFile;
                spriteCache.set(safeFile, entry);
            }

            if (entry.failed && safeFile !== DEFAULT_SPRITE_FILE) {
                return getSprite(DEFAULT_SPRITE_FILE);
            }

            return entry;
        }

        let lastAnimTime = 0;
        let lastFrameTime = 0;

        const FRAME_DURATION = 150;
        const ANIMATION_SEQUENCE = [0, 1, 2, 1];

        let viewScale = 1;
        let viewOffsetX = 0;
        let viewOffsetY = 0;

        function resize() {
            canvas.width = Math.floor(window.innerWidth);
            canvas.height = Math.floor(window.innerHeight);

            ctx.imageSmoothingEnabled = false;

            viewScale = Math.max(
                0.01,
                Math.min(canvas.width / WORLD_W, canvas.height / WORLD_H)
            );

            viewOffsetX = Math.floor((canvas.width - WORLD_W * viewScale) / 2);
            viewOffsetY = Math.floor((canvas.height - WORLD_H * viewScale) / 2);
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(value, max));
        }

        function round1(value) {
            return Math.round(value * 10) / 10;
        }

        const roomImage = new Image();
        let roomReady = false;

        roomImage.onload = () => {
            roomReady = true;
        };

        // The room image is loaded by the preloader below.

        function drawRoom() {
            if (roomReady) {
                ctx.drawImage(roomImage, 0, 0, WORLD_W, WORLD_H);
                return;
            }

            ctx.fillStyle = '#2a1f3a';
            ctx.fillRect(0, 0, WORLD_W, WORLD_H);
        }

        function drawCharacter(character) {
            const direction = DIRECTIONS[character.dir] || DIRECTIONS.down;
            const entry = getSprite(character.spriteFile);

            if (!entry.ready) {
                ctx.fillStyle = '#0f0';
                ctx.fillRect(
                    Math.floor(character.x),
                    Math.floor(character.y),
                    SPRITE_W,
                    SPRITE_H
                );
                return;
            }

            ctx.drawImage(
                entry.image,
                character.frame * FRAME_W + SAFE_OFFSET_X,
                direction.row * FRAME_H + SAFE_OFFSET_Y,
                SAFE_W,
                SAFE_H,
                Math.floor(character.x),
                Math.floor(character.y),
                SPRITE_W,
                SPRITE_H
            );
        }

        function updateAnimation(timestamp) {
            if (!player.isMoving) {
                player.frame = 1;
                player.animStep = 0;
                lastAnimTime = 0;
                return;
            }

            if (timestamp - lastAnimTime >= FRAME_DURATION) {
                lastAnimTime = timestamp;
                player.animStep =
                    (player.animStep + 1) % ANIMATION_SEQUENCE.length;

                player.frame = ANIMATION_SEQUENCE[player.animStep];
            }
        }

        // ---------------------------------------------------------------------------
        // Other players
        // ---------------------------------------------------------------------------

        const remotePlayers = new Map();
        let selfId = null;

        function upsertRemote(info) {
            if (!info || typeof info.id !== 'string' || info.id === selfId) {
                return;
            }

            let remote = remotePlayers.get(info.id);
            const isNew = !remote;

            if (isNew) {
                remote = {
                    id: info.id,
                    name: '',
                    spriteFile: DEFAULT_SPRITE_FILE,
                    x: 0,
                    y: 0,
                    targetX: 0,
                    targetY: 0,
                    dir: 'down',
                    moving: false,
                    frame: 1,
                    animStep: 0,
                    lastAnimTime: 0
                };

                remotePlayers.set(info.id, remote);
            }

            if (typeof info.sprite === 'string') {
                remote.spriteFile = info.sprite;
            }

            if (typeof info.name === 'string') {
                remote.name = info.name;
            }

            if (Number.isFinite(info.x) && Number.isFinite(info.y)) {
                remote.targetX = clamp(info.x, WALK_BOUNDS.minX, WALK_BOUNDS.maxX);
                remote.targetY = clamp(info.y, minYFor(remote.spriteFile), WALK_BOUNDS.maxY);

                if (isNew) {
                    remote.x = remote.targetX;
                    remote.y = remote.targetY;
                }
            }

            if (isDirection(info.dir)) {
                remote.dir = info.dir;
            }

            if (typeof info.moving === 'boolean') {
                remote.moving = info.moving;
            }
        }

        function updateRemoteAnimation(remote, timestamp) {
            if (!remote.moving) {
                remote.frame = 1;
                remote.animStep = 0;
                remote.lastAnimTime = 0;
                return;
            }

            if (!remote.lastAnimTime) {
                remote.lastAnimTime = timestamp;
                remote.animStep = 0;
                remote.frame = 0;
                return;
            }

            if (timestamp - remote.lastAnimTime >= FRAME_DURATION) {
                remote.lastAnimTime = timestamp;
                remote.animStep =
                    (remote.animStep + 1) % ANIMATION_SEQUENCE.length;

                remote.frame = ANIMATION_SEQUENCE[remote.animStep];
            }
        }

        function updateRemotePlayers(timestamp, dt) {
            const k = 1 - Math.exp(-dt * 12);

            for (const remote of remotePlayers.values()) {
                const dx = remote.targetX - remote.x;
                const dy = remote.targetY - remote.y;

                if (Math.abs(dx) + Math.abs(dy) > 120) {
                    remote.x = remote.targetX;
                    remote.y = remote.targetY;
                } else {
                    remote.x += dx * k;
                    remote.y += dy * k;
                }

                updateRemoteAnimation(remote, timestamp);
            }
        }

        // ---------------------------------------------------------------------------
        // Welcome dialog and lobby music
        // ---------------------------------------------------------------------------

        let welcomeDismissed = false;
        let lobbyMusic = null;

        try {
            lobbyMusic = new Audio();
            lobbyMusic.loop = true;
            lobbyMusic.preload = 'auto';
        } catch (error) {
            lobbyMusic = null;
        }

        function startLobbyMusic() {
            try {
                if (!lobbyMusic || !lobbyMusic.paused) {
                    return;
                }

                const playPromise = lobbyMusic.play();

                if (playPromise && playPromise.catch) {
                    playPromise.catch(() => {});
                }
            } catch (error) {
                // Music must never break the game.
            }
        }

        function setupWelcomeDialog() {
            const overlay = document.getElementById('welcomeOverlay');
            const okButton = document.getElementById('welcomeOk');

            if (!overlay || !okButton) {
                welcomeDismissed = true;
                return;
            }

            function dismissWelcome(event) {
                if (event) {
                    event.preventDefault();
                }

                if (welcomeDismissed) {
                    return;
                }

                welcomeDismissed = true;
                overlay.hidden = true;
                startLobbyMusic();
            }

            okButton.addEventListener('touchend', dismissWelcome, { passive: false });
            okButton.addEventListener('click', dismissWelcome);
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && welcomeDismissed) {
                startLobbyMusic();
            }
        });

        // ---------------------------------------------------------------------------
        // Server connection
        // ---------------------------------------------------------------------------

        let socket = null;
        let reconnectDelay = 1000;
        let stopReconnect = false;
        let reconnectTimer = null;
        let connectTimeoutTimer = null;
        let lastSentState = null;
        let lastSendTime = 0;
        let connectionState = 'connecting';
        let connectAttempts = 0;
        let lastCloseCode = '-';

        let DEBUG = false;

        try {
            DEBUG = new URLSearchParams(window.location.search).has('debug');
        } catch (error) {
            DEBUG = false;
        }

        function sendJson(message) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                try {
                    socket.send(JSON.stringify(message));
                } catch (error) {
                    // Ignore send errors; the close handler will reconnect.
                }
            }
        }

        function getTelegramUser() {
            try {
                return tg?.initDataUnsafe?.user || null;
            } catch (error) {
                return null;
            }
        }

        function handleServerMessage(raw) {
            let msg;

            try {
                msg = JSON.parse(raw);
            } catch (error) {
                return;
            }

            if (!msg || typeof msg.type !== 'string') {
                return;
            }

            if (msg.type === 'welcome') {
                selfId = typeof msg.selfId === 'string' ? msg.selfId : null;

                serverReady = true;
                updateLoading();

                remotePlayers.clear();

                if (Array.isArray(msg.players)) {
                    for (const info of msg.players) {
                        if (info && info.id === selfId) {
                            if (typeof info.sprite === 'string') {
                                player.spriteFile = info.sprite;
                            }
                        } else {
                            upsertRemote(info);
                        }
                    }
                }

                lastSentState = null;
                return;
            }

            if (msg.type === 'joined') {
                upsertRemote(msg.player);
                return;
            }

            if (msg.type === 'left') {
                remotePlayers.delete(msg.id);
                return;
            }

            if (msg.type === 'snapshot') {
                if (Array.isArray(msg.players)) {
                    for (const info of msg.players) {
                        upsertRemote(info);
                    }
                }
                return;
            }

        }

        function scheduleReconnect() {
            if (reconnectTimer || stopReconnect) {
                return;
            }

            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectToServer();
            }, reconnectDelay);

            reconnectDelay = Math.min(reconnectDelay * 2, 10000);
        }

        function connectToServer() {
            if (
                socket &&
                (socket.readyState === WebSocket.OPEN ||
                    socket.readyState === WebSocket.CONNECTING)
            ) {
                return;
            }

            let ws;

            connectionState = 'connecting';
            connectAttempts++;

            try {
                ws = new WebSocket(SERVER_URL);
            } catch (error) {
                scheduleReconnect();
                return;
            }

            socket = ws;

            clearTimeout(connectTimeoutTimer);
            connectTimeoutTimer = setTimeout(() => {
                if (ws.readyState === WebSocket.CONNECTING) {
                    ws.close();
                }
            }, 60000);

            ws.addEventListener('open', () => {
                clearTimeout(connectTimeoutTimer);
                reconnectDelay = 1000;
                connectionState = 'online';

                const user = getTelegramUser();

                sendJson({
                    type: 'join',
                    tgId: user?.id ?? null,
                    username: user?.username ?? '',
                    name: user?.first_name || user?.username || 'Player',
                    x: round1(player.x),
                    y: round1(player.y),
                    dir: player.dir
                });

            });

            ws.addEventListener('message', event => {
                try {
                    handleServerMessage(event.data);
                } catch (error) {
                    // A bad message must never break the game.
                }
            });

            ws.addEventListener('close', event => {
                clearTimeout(connectTimeoutTimer);
                connectionState = 'offline';
                lastCloseCode = event && event.code !== undefined ? event.code : '-';

                if (event && event.code === 4000) {
                    stopReconnect = true;
                }

                if (socket === ws) {
                    socket = null;
                    selfId = null;
                    remotePlayers.clear();
                }

                scheduleReconnect();
            });

            ws.addEventListener('error', () => {});
        }

        function sendStateIfNeeded(timestamp) {
            if (!selfId || timestamp - lastSendTime < STATE_SEND_INTERVAL_MS) {
                return;
            }

            const state = {
                x: round1(player.x),
                y: round1(player.y),
                dir: player.dir,
                moving: player.isMoving
            };

            if (
                lastSentState &&
                lastSentState.x === state.x &&
                lastSentState.y === state.y &&
                lastSentState.dir === state.dir &&
                lastSentState.moving === state.moving
            ) {
                return;
            }

            lastSentState = state;
            lastSendTime = timestamp;

            sendJson({
                type: 'state',
                x: state.x,
                y: state.y,
                dir: state.dir,
                moving: state.moving
            });
        }

        // ---------------------------------------------------------------------------
        // Game loop
        // ---------------------------------------------------------------------------

        function update(timestamp, dt) {
            if (player.isMoving) {
                const direction = DIRECTIONS[player.dir];

                const nextX = clamp(
                    player.x + direction.dx * SPEED * dt,
                    WALK_BOUNDS.minX,
                    WALK_BOUNDS.maxX
                );

                const nextY = clamp(
                    player.y + direction.dy * SPEED * dt,
                    minYFor(player.spriteFile),
                    WALK_BOUNDS.maxY
                );

                if (!isFeetBlocked(nextX, player.y)) {
                    player.x = nextX;
                }

                if (!isFeetBlocked(player.x, nextY)) {
                    player.y = nextY;
                }
            }

            updateAnimation(timestamp);
            updateRemotePlayers(timestamp, dt);
            sendStateIfNeeded(timestamp);
        }

        function drawDebug() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, 340, 22);
            ctx.fillStyle = '#0f0';
            ctx.font = '14px monospace';
            ctx.textBaseline = 'top';
            ctx.fillText(
                'net: ' + connectionState +
                ' | players: ' + (remotePlayers.size + (selfId ? 1 : 0)) +
                ' | tries: ' + connectAttempts +
                ' | close: ' + lastCloseCode,
                6,
                4
            );
        }

        function render() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            let s = viewScale;
            let ox = viewOffsetX;
            let oy = viewOffsetY;

            if (followCam) {
                s = viewScale * CAM_ZOOM;
                const cx = Math.floor(player.x) + SPRITE_W / 2;
                const cy = Math.floor(player.y) + SPRITE_H / 2;
                ox = camAxis(canvas.width, WORLD_W * s, canvas.width / 2 - cx * s);
                oy = camAxis(canvas.height, WORLD_H * s, canvas.height / 2 - cy * s);
            }

            ctx.setTransform(s, 0, 0, s, Math.round(ox), Math.round(oy));

            ctx.beginPath();
            ctx.rect(0, 0, WORLD_W, WORLD_H);
            ctx.clip();

            drawRoom();

            const characters = [player, ...remotePlayers.values()];
            characters.sort((a, b) => a.y - b.y);

            for (const character of characters) {
                drawCharacter(character);
            }

            ctx.restore();

            if (DEBUG) {
                drawDebug();
            }
        }

        function gameLoop(timestamp) {
            const dt = lastFrameTime
                ? Math.min(0.05, (timestamp - lastFrameTime) / 1000)
                : 0;

            lastFrameTime = timestamp;

            update(timestamp, dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        // ---------------------------------------------------------------------------
        // Controls
        // ---------------------------------------------------------------------------

        function handleInput(direction, pressed) {
            if (pressed && !welcomeDismissed) {
                return;
            }

            if (pressed) {
                player.dir = direction;
                player.isMoving = true;
                player.animStep = 0;
                player.frame = 0;
                lastAnimTime = performance.now();
            } else {
                player.isMoving = false;
            }
        }

        function setupTouchControls() {
            document.querySelectorAll('.btn').forEach(button => {
                const direction = button.dataset.dir;

                button.addEventListener(
                    'touchstart',
                    event => {
                        event.preventDefault();
                        button.classList.add('active');
                        handleInput(direction, true);
                    },
                    { passive: false }
                );

                button.addEventListener(
                    'touchend',
                    event => {
                        event.preventDefault();
                        button.classList.remove('active');
                        handleInput(direction, false);
                    },
                    { passive: false }
                );

                button.addEventListener('touchcancel', () => {
                    button.classList.remove('active');
                    handleInput(direction, false);
                });

                button.addEventListener('mousedown', () => {
                    button.classList.add('active');
                    handleInput(direction, true);
                });

                button.addEventListener('mouseup', () => {
                    button.classList.remove('active');
                    handleInput(direction, false);
                });

                button.addEventListener('mouseleave', () => {
                    button.classList.remove('active');
                    handleInput(direction, false);
                });
            });
        }

        function setupKeyboardControls() {
            const keys = {};

            window.addEventListener('keydown', event => {
                if (keys[event.key]) {
                    return;
                }

                keys[event.key] = true;

                if (event.key === 'ArrowUp' || event.key === 'w') {
                    handleInput('up', true);
                }

                if (event.key === 'ArrowDown' || event.key === 's') {
                    handleInput('down', true);
                }

                if (event.key === 'ArrowLeft' || event.key === 'a') {
                    handleInput('left', true);
                }

                if (event.key === 'ArrowRight' || event.key === 'd') {
                    handleInput('right', true);
                }
            });

            window.addEventListener('keyup', event => {
                keys[event.key] = false;

                if (
                    (event.key === 'ArrowUp' || event.key === 'w') &&
                    !keys.ArrowUp &&
                    !keys.w
                ) {
                    handleInput('up', false);
                }

                if (
                    (event.key === 'ArrowDown' || event.key === 's') &&
                    !keys.ArrowDown &&
                    !keys.s
                ) {
                    handleInput('down', false);
                }

                if (
                    (event.key === 'ArrowLeft' || event.key === 'a') &&
                    !keys.ArrowLeft &&
                    !keys.a
                ) {
                    handleInput('left', false);
                }

                if (
                    (event.key === 'ArrowRight' || event.key === 'd') &&
                    !keys.ArrowRight &&
                    !keys.d
                ) {
                    handleInput('right', false);
                }
            });
        }

        window.addEventListener('resize', resize);

        resize();

        // Spawn on the carpet, with a small random spread so players do not stack exactly.
        player.x = Math.floor(WORLD_W / 2 - SPRITE_W / 2 + (Math.random() * 80 - 40));
        player.y = Math.floor(270 - SPRITE_H + (Math.random() * 30 - 15));

        getSprite(DEFAULT_SPRITE_FILE);

        const PRELOAD_SPRITES = [
            'SPRITE.png', 'FWLAI.png', 'MELO.png', 'MAKAN.png', 'KITSU.png',
            'JANA.png', 'KOT.png', 'TEKSU.png', 'MEI.png', 'AGATA.png', 'SETARE.png'
        ];
        const MUSIC_FILE = 'LOBBY-MUSIC.mp3';
        const MUSIC_WEIGHT = 8;
        const SERVER_WEIGHT = 4;
        const RELOAD_BUTTON_AFTER_MS = 40000;

        let imagesLoaded = 0;
        let musicFraction = 0;
        let assetsFinished = false;
        let serverReady = false;
        let loadingFinished = false;

        const loadingRoot = document.getElementById('loadingOverlay');
        document.body.appendChild(loadingRoot);
        loadingRoot.style.position = 'fixed';
        loadingRoot.style.zIndex = '2000';

        const loadingEls = {
            overlay: document.getElementById('loadingOverlay'),
            text: document.getElementById('loadingText'),
            fill: document.getElementById('loadingFill'),
            hint: document.getElementById('loadingHint'),
            reload: document.getElementById('loadingReload')
        };

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function loadImageInto(img, src) {
            return new Promise(resolve => {
                let attempt = 0;

                const tryLoad = () => {
                    attempt++;

                    img.onload = () => resolve(true);

                    img.onerror = () => {
                        if (attempt < 4) {
                            setTimeout(tryLoad, 700 * attempt);
                        } else {
                            resolve(false);
                        }
                    };

                    img.src = attempt > 1 ? src + '?r=' + attempt : src;
                };

                tryLoad();
            });
        }

        function finishLoading() {
            loadingFinished = true;

            if (loadingEls.overlay) {
                loadingEls.overlay.hidden = true;
            }

            const overlay = document.getElementById('welcomeOverlay');

            if (overlay && !welcomeDismissed) {
                overlay.hidden = false;
            }
        }

        function updateLoading() {
            if (!loadingEls.overlay || loadingFinished) {
                return;
            }

            const totalUnits = PRELOAD_SPRITES.length + 1 + MUSIC_WEIGHT + SERVER_WEIGHT;
            const doneUnits =
                imagesLoaded +
                MUSIC_WEIGHT * musicFraction +
                (serverReady ? SERVER_WEIGHT : 0);

            const percent = Math.min(100, Math.floor((doneUnits / totalUnits) * 100));

            loadingEls.fill.style.width = percent + '%';
            loadingEls.text.textContent = 'LOADING ' + percent + '%';

            if (assetsFinished && !serverReady) {
                loadingEls.hint.textContent = 'CONNECTING TO SERVER... THIS CAN TAKE A MINUTE';
            }

            if (assetsFinished && serverReady) {
                finishLoading();
            }
        }

        async function preloadSprite(file) {
            const img = new Image();
            const ok = await loadImageInto(img, file);

            if (ok) {
                spriteCache.set(file, { image: img, ready: true, failed: false });
            }

            imagesLoaded++;
            updateLoading();
        }

        async function preloadRoom() {
            roomReady = await loadImageInto(roomImage, ROOM_IMAGE_FILE);
            imagesLoaded++;
            updateLoading();
        }

        async function preloadMusic() {
            for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                    const res = await fetch(MUSIC_FILE);

                    if (!res.ok) {
                        throw new Error('bad status');
                    }

                    const total = Number(res.headers.get('content-length')) || 0;
                    let blob;

                    if (res.body && res.body.getReader && total) {
                        const reader = res.body.getReader();
                        const chunks = [];
                        let received = 0;

                        for (;;) {
                            const result = await reader.read();

                            if (result.done) {
                                break;
                            }

                            chunks.push(result.value);
                            received += result.value.length;
                            musicFraction = Math.min(1, received / total);
                            updateLoading();
                        }

                        blob = new Blob(chunks, {
                            type: res.headers.get('content-type') || 'audio/mpeg'
                        });
                    } else {
                        blob = await res.blob();
                    }

                    if (lobbyMusic) {
                        lobbyMusic.src = URL.createObjectURL(blob);
                    }

                    musicFraction = 1;
                    updateLoading();
                    return;
                } catch (error) {
                    musicFraction = 0;
                    await wait(800 * attempt);
                }
            }

            // Music must never block the game: fall back to normal streaming.
            if (lobbyMusic) {
                lobbyMusic.src = MUSIC_FILE;
            }

            musicFraction = 1;
            updateLoading();
        }

        async function startPreload() {
            await Promise.all([
                preloadRoom(),
                ...PRELOAD_SPRITES.map(preloadSprite),
                preloadMusic()
            ]);

            assetsFinished = true;
            updateLoading();
        }

        if (loadingEls.reload) {
            loadingEls.reload.addEventListener('click', () => {
                location.reload();
            });
        }

        setTimeout(() => {
            if (!loadingFinished && loadingEls.overlay) {
                loadingEls.hint.textContent = 'STILL LOADING... TAP RELOAD IF NOTHING HAPPENS';
                loadingEls.reload.hidden = false;
            }
        }, RELOAD_BUTTON_AFTER_MS);

        startPreload();

        setupWelcomeDialog();
        setupTouchControls();
        setupKeyboardControls();

        window.addEventListener('pagehide', () => {
            stopReconnect = true;

            try {
                if (socket) {
                    socket.close(1000);
                }
            } catch (error) {
                // Ignore close errors.
            }
        });

        window.addEventListener('pageshow', () => {
            stopReconnect = false;
            connectToServer();
        });
        connectToServer();

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
